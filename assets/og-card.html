<html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:"Noto Sans",system-ui,sans-serif;color:#ccd6f6;

.pill i{width:11px;height:11px;border-radius:50%;background:#64ffda}

.foot{margin-top:auto;display:flex;justify-content:space-between;font:500 22px "DejaVu Sans Mono",monospace;color:#a8b2d1}
.foot b{color:#64ffda;font-weight:600}
</style></head><body><div class="wrap">
